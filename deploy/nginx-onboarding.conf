# FBSI Onboarding app mounted at https://<your-domain>/onboarding
# Paste these blocks INSIDE the existing `server { ... }` block that serves your
# site (the one that already terminates TLS for the domain). Then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx matches the longest prefix, so /onboarding/api/ always wins over /onboarding/.

# Bare /onboarding -> /onboarding/ (so relative asset paths resolve).
location = /onboarding { return 301 /onboarding/; }

# API: strip the /onboarding/api prefix so Fastify keeps its native /api/* routes.
# (Trailing slashes on both sides are what makes nginx rewrite the path.)
location /onboarding/api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
}

# SPA: serve the static build. The bundle is built with base=/onboarding/, so its
# asset URLs (/onboarding/assets/...) map here. Unknown paths fall back to index.html.
location /onboarding/ {
    alias /var/www/onboarding/;
    try_files $uri $uri/ /onboarding/index.html;
}
